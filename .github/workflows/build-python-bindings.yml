name: Build Python bindings

# Manual trigger only: run from the Actions tab (choose the branch/tag to
# build from the "Use workflow from" dropdown).
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-wheels:
    name: Build wheels (${{ matrix.os }} / ${{ matrix.archs }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # The most-used 64-bit platform/architecture combinations.
          - os: ubuntu-latest
            archs: x86_64
          - os: windows-latest
            archs: AMD64
          # A single arm64 runner cross-compiles both macOS wheels via the
          # Xcode toolchain (and can test the x86_64 one through Rosetta 2).
          - os: macos-latest
            archs: "x86_64 arm64"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_ARCHS: ${{ matrix.archs }}

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: wheelhouse/*.whl

  pip-install-smoke-test:
    name: pip install from GitHub (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No checkout: installs straight from GitHub over the network, the
      # same way an end user would, from the exact commit that triggered
      # this workflow run.
      - name: pip install "git+https://github.com/${{ github.repository }}"
        run: |
          pip install "git+https://github.com/${{ github.repository }}.git@${{ github.sha }}"

      - name: Smoke test the installed package
        run: |
          python -c "import kflib_estimators as kf; e = kf.FiveStateEstimator(); e.predict(0.1, 0.0, 0.0, 0.01); print(e.get_state())"
